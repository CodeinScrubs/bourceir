name: BRS CI Tests

on:
  push:
    branches: [ master, "feature/**" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# مخزن عمومی است: CI فقط اجازه خواندن دارد
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # کاربر روی ویندوز کار می‌کند؛ لینوکس با TZ=UTC تضمین می‌کند کد به ساعت محلی وابسته نیست
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TZ: UTC
      PYTHONUTF8: "1"
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.lock.txt

    - name: Install locked dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock.txt
        pip check

    - name: Lint (ruff)
      run: ruff check .

    - name: Check displayed and package versions agree
      run: python -c "import tomllib; from pathlib import Path; from config import settings; assert settings.VERSION == tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']"

    - name: Set up Node for read-only capture checks
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Check read-only capture validation
      run: node --test tests/farabi_capture.test.mjs

    - name: Run Pytest test suite (offline)
      run: python -m pytest tests/ -m "not network" -v

    - name: Offline doctor report
      run: python brs.py doctor --offline --json doctor-ci.json

    - name: Verify actual Windows setup entry point
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        python -m venv venv
        call SETUP.bat --ci

    - name: Install standalone Farabi capture runtime and launch Chromium offline
      if: runner.os == 'Windows'
      shell: cmd
      run: call SETUP_FARABI.bat --ci

    - name: Windows setup must propagate a database failure
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $corruptDb = Join-Path $env:RUNNER_TEMP 'brs-setup-test-corrupt.db'
        [System.IO.File]::WriteAllText($corruptDb, 'invalid SQLite test fixture')
        $env:BRS_DB_PATH = $corruptDb
        cmd /c "call SETUP.bat --ci"
        if ($LASTEXITCODE -ne 1) { throw 'SETUP did not propagate the doctor failure' }
        $global:LASTEXITCODE = 0
