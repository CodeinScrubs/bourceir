name: BRS CI Tests

on:
  push:
    branches: [ master, "feature/**" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# مخزن عمومی است: CI فقط اجازه خواندن دارد
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # کاربر روی ویندوز کار می‌کند؛ لینوکس با TZ=UTC تضمین می‌کند کد به ساعت محلی وابسته نیست
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TZ: UTC
      PYTHONUTF8: "1"
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.lock.txt

    - name: Install locked dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock.txt
        pip check

    - name: Lint (ruff)
      run: ruff check .

    - name: Run Pytest test suite (offline)
      run: python -m pytest tests/ -m "not network" -v

    - name: Offline doctor report
      run: python brs.py doctor --offline --json doctor-ci.json
