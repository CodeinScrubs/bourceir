# BRS Configuration File: Default Environment
# ============================================
# همه تنظیمات قابل تغییر سامانه در این فایل است. مقادیر محرمانه (کلید API) در فایل .env نگهداری می‌شوند.

project:
  name: "BRS Quant Engine"
  version: "0.7.33"
  environment: "development"

market:
  timezone: "Asia/Tehran"
  price_unit: "Rial"
  trading_hours:
    start: "09:00"
    end: "12:30"
    pre_market_start: "08:45"
  trading_days: [5, 6, 0, 1, 2] # شنبه تا چهارشنبه (weekday پایتون)

# دامنه پروژه: فقط سهام عادی بورس و فرابورس
universe:
  # کد نوع ابزار در TSETMC (yVal): 300 = سهام بورس، 303 = سهام فرابورس
  instrument_types: [300, 303]
  # 309 = سهام بازار پایه فرابورس (نقدشوندگی و قوانین متفاوت؛ پیش‌فرض خاموش)
  include_base_market: false
  # 313 = بازار شرکت‌های کوچک و متوسط فرابورس (پیش‌فرض خاموش)
  include_sme_market: false
  # نمادهای ختم‌شده به عدد (مانند «فولاد2» یا «ونفت3») تابلوهای بلوکی/عمده هستند و حذف می‌شوند
  exclude_block_boards: true

data_collection:
  primary_source: "tsetmc"
  polling_interval_seconds: 30
  max_retries: 3
  retry_delay_seconds: 5
  rate_limit_delay: 0.5
  request_timeout_seconds: 30
  stale_data_threshold_seconds: 90 # هشدار در صورت تاخیر بیش از ۹۰ ثانیه
  # نمادهای پیش‌فرض برای تست سریع (قبل از همگام‌سازی کل بازار)
  symbols:
    - "خودرو"
    - "فولاد"
    - "شپنا"
    - "وبملت"
    - "کگل"

# کارمزدهای رسمی معاملات سهام (کسری از ارزش معامله)
fees:
  buy: 0.003712   # ۰.۳۷۱۲٪
  sell: 0.008800  # ۰.۸۸٪ (شامل مالیات فروش)

backtest:
  default_slippage_bps: 10.0
  max_volume_participation_pct: 0.05
  initial_capital: 100000000.0 # 100,000,000 Rial = 10,000,000 Toman
  # اجرای سفارش در روز بعد از سیگنال، به قیمت میانگین موزون روز (ارزش ÷ حجم)
  execution_price: "next_day_vwap"
  # حداقل فاصله «قیمت معامله‌شده» از قیمت مرجع برای تشخیص صف قفل (وقتی کل روز در یک قیمت معامله شده).
  # دامنه نوسان تاریخی بین ±۲٪ تا ±۷٪ بوده؛ ۰.۵٪ فقط معاملات تک‌قیمتی کم‌اهمیت نزدیک قیمت مرجع را حذف می‌کند.
  lock_min_move_pct: 0.005

research:
  # فاز ۱-ج: برچسب‌ها و استراتژی‌های پایه
  horizons: [1, 2, 3, 5]            # افق نگهداری به جلسه معاملاتی (خرید فردا، فروش h جلسه بعد)
  top_k: 5                          # تعداد سهم انتخابی هر روز
  # حداقل ارزش معاملات روز تصمیم (ریال): سفارش ۱۰۰ میلیون تومانی ≤ ۵٪ ارزش روز ← ۲ میلیارد تومان
  min_daily_value_rial: 20000000000
  dev_start: "2012-03-20"           # ۱۳۹۱/۰۱/۰۱ — شروع دوره پژوهش (پوشش خوب آمار حقیقی/حقوقی)
  # از این تاریخ به بعد «بیرون از نمونه» و مهر و موم است؛ فقط برای ارزیابی نهایی مدل منتخب باز می‌شود
  holdout_start: "2025-03-21"       # ۱۴۰۴/۰۱/۰۱
  random_trials: 100                # تعداد تکرار انتخاب تصادفی برای توزیع مرجع

governance:
  enforce_point_in_time: true
  prevent_lookahead_bias: true

# هوش مصنوعی TypeSafe Jev (کلید در فایل .env با نام TYPESAFE_API_KEY)
ai:
  jev_model: "jev-1.13.0"   # نسخه ثابت برای تکرارپذیری آزمایش‌ها
  jev_timeout_seconds: 30
