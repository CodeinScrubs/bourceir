[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brs-quant-engine"
version = "0.2.0"
description = "سامانه هوشمند مهندسی داده و نوسان‌گیری کمی در بورس تهران (TSE)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BRS Trading Team"}
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pytz>=2023.3",
    "jdatetime>=4.1.0",
    "streamlit>=1.30.0",
    "pytse-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
