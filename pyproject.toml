[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brs-quant-engine"
version = "0.7.12"
description = "سامانه هوشمند نوسان‌گیری درون‌روزی و کوتاه‌مدت سهام بورس و فرابورس تهران"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [{name = "BRS Trading Team"}]
# فهرست کامل و نسخه‌های قفل‌شده: requirements.txt و requirements.lock.txt

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "network: آزمون‌هایی که به اینترنت (TSETMC/کدال/TypeSafe) نیاز دارند؛ در CI اجرا نمی‌شوند",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "venv-*", ".venv", "data", "logs"]

[tool.ruff.lint]
# E9/F: خطاهای واقعی (نام تعریف‌نشده، import بی‌استفاده، خطای نحوی)؛ I: مرتب‌سازی importها
select = ["E9", "F", "I"]
